<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1016" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>Road Fighter</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ============ GAME CANVAS ============ -->
  <canvas id="game"></canvas>

  <!-- ============ HUD ============ -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-block">
        <div class="hud-label">SCORE</div>
        <div class="hud-value" id="score">0</div>
        <div class="hud-sub" id="speed">0 KM/H</div>
      </div>
      <div class="hud-buttons">
        <button class="icon-btn" id="btnSound" aria-label="Toggle sound">
          <svg id="icoSoundOn" viewBox="0 0 24 24" width="20" height="20">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
            <path d="M16.4 8.6a5 5 0 0 1 0 6.8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M19 6a8.6 8.6 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
          <svg id="icoSoundOff" viewBox="0 0 24 24" width="20" height="20" style="display:none">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
            <path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="btnPause" aria-label="Pause">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor"/>
            <rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="fuel-row">
      <span class="fuel-label">FUEL</span>
      <div class="fuel-track"><div class="fuel-fill" id="fuelFill"></div></div>
    </div>
  </div>

  <!-- ============ START SCREEN ============ -->
  <div id="screen-start" class="screen">
    <div class="title">ROAD<br/>FIGHTER</div>
    <div class="subtitle">CLASSIC ARCADE RACER</div>
    <div class="best-row">
      <span class="best-label">BEST</span>
      <span class="best-value" id="startBest">0</span>
    </div>
    <button class="btn" id="btnStart">START ENGINE</button>
    <div class="hint">
      <span>◀ DRAG TO STEER ▶</span>
      <span>COLLECT FUEL · AVOID TRAFFIC</span>
    </div>
  </div>

  <!-- ============ PAUSE SCREEN ============ -->
  <div id="screen-pause" class="screen hidden">
    <div class="title small">PAUSED</div>
    <button class="btn" id="btnResume">RESUME</button>
    <button class="btn ghost" id="btnQuit">QUIT TO MENU</button>
  </div>

  <!-- ============ GAME OVER SCREEN ============ -->
  <div id="screen-over" class="screen hidden">
    <div class="title small" id="overReason">GAME OVER</div>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">SCORE</div>
        <div class="stat-value" id="finalScore">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">BEST</div>
        <div class="stat-value" id="finalBest">0</div>
      </div>
    </div>
    <button class="btn" id="btnRetry">RETRY</button>
    <button class="btn ghost" id="btnMenu">MAIN MENU</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
